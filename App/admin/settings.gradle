pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    plugins {
        id 'com.android.application' version '9.4.0'
        id 'org.jetbrains.kotlin.android' version '2.2.10'
        id 'com.google.gms.google-services' version '4.4.1'
    }
}
