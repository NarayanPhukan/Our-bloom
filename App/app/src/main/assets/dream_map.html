<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Dream Locations Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        html, body, #map {
            width: 100%;
            height: 100%;
            background-color: #121013;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        .leaflet-container {
            background-color: #121013;
        }
        .custom-heart-pin {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(30, 22, 28, 0.88);
            border: 2px solid;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5), 0 0 12px currentColor;
            cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .custom-heart-pin:hover, .custom-heart-pin:active {
            transform: scale(1.18);
        }
        .custom-heart-pin span {
            font-size: 20px;
            line-height: 1;
        }
        .pin-dreaming { border-color: #FF5E8E; color: #FF5E8E; }
        .pin-planning { border-color: #F59E0B; color: #F59E0B; }
        .pin-booked { border-color: #38BDF8; color: #38BDF8; }
        .pin-visited { border-color: #10B981; color: #10B981; }

        .leaflet-popup-content-wrapper {
            background: rgba(26, 20, 25, 0.95);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 94, 142, 0.3);
            border-radius: 18px;
            color: #FFFFFF;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            padding: 4px;
        }
        .leaflet-popup-tip {
            background: rgba(26, 20, 25, 0.95);
        }
        .popup-content {
            padding: 8px 10px;
            max-width: 200px;
            text-align: center;
        }
        .popup-content img {
            width: 100%;
            height: 96px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 8px;
        }
        .popup-title {
            font-size: 15px;
            font-weight: 700;
            color: #FF85A2;
            margin-bottom: 4px;
        }
        .popup-status {
            display: inline-block;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 999px;
            margin-bottom: 6px;
        }
        .status-dreaming { background: rgba(255, 94, 142, 0.2); color: #FF85A2; }
        .status-planning { background: rgba(245, 158, 11, 0.2); color: #FBBF24; }
        .status-booked { background: rgba(56, 189, 248, 0.2); color: #7DD3FC; }
        .status-visited { background: rgba(16, 185, 129, 0.2); color: #34D399; }
        .popup-desc {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.8);
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <div id="map"></div>

    <script>
        var map;
        var markersLayer = L.layerGroup();
        var polylineLayer = L.layerGroup();
        var draftMarker = null;

        function initMap() {
            // Romantic CartoDB Dark Matter or Voyager tiles
            map = L.map('map', {
                center: [20.0, 10.0],
                zoom: 2,
                zoomControl: false,
                attributionControl: false
            });

            L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
                maxZoom: 19,
                subdomains: 'abcd'
            }).addTo(map);

            markersLayer.addTo(map);
            polylineLayer.addTo(map);

            map.on('click', function(e) {
                var lat = e.latlng.lat;
                var lng = e.latlng.lng;
                addDraftMarker(lat, lng);
                if (window.AndroidBridge && window.AndroidBridge.onMapClicked) {
                    window.AndroidBridge.onMapClicked(lat, lng);
                }
            });

            if (window.AndroidBridge && window.AndroidBridge.onMapReady) {
                window.AndroidBridge.onMapReady();
            }
        }

        function getPinEmoji(status) {
            if (status === 'Planning') return '🧭';
            if (status === 'Booked') return '✈️';
            if (status === 'Visited') return '✨';
            return '💖';
        }

        function getPinClass(status) {
            if (status === 'Planning') return 'pin-planning';
            if (status === 'Booked') return 'pin-booked';
            if (status === 'Visited') return 'pin-visited';
            return 'pin-dreaming';
        }

        function getStatusClass(status) {
            if (status === 'Planning') return 'status-planning';
            if (status === 'Booked') return 'status-booked';
            if (status === 'Visited') return 'status-visited';
            return 'status-dreaming';
        }

        function setLocations(locationsJson) {
            try {
                var locations = typeof locationsJson === 'string' ? JSON.parse(locationsJson) : locationsJson;
                markersLayer.clearLayers();
                polylineLayer.clearLayers();

                if (draftMarker) {
                    map.removeLayer(draftMarker);
                    draftMarker = null;
                }

                var visitedCoords = [];
                var bounds = [];

                locations.forEach(function(loc) {
                    var lat = parseFloat(loc.lat);
                    var lng = parseFloat(loc.lng);
                    if (isNaN(lat) || isNaN(lng)) return;

                    bounds.push([lat, lng]);

                    var emoji = getPinEmoji(loc.status);
                    var pinClass = getPinClass(loc.status);
                    var statusClass = getStatusClass(loc.status);

                    var icon = L.divIcon({
                        className: '',
                        html: '<div class="custom-heart-pin ' + pinClass + '"><span>' + emoji + '</span></div>',
                        iconSize: [44, 44],
                        iconAnchor: [22, 22],
                        popupAnchor: [0, -22]
                    });

                    var marker = L.marker([lat, lng], { icon: icon });

                    var popupHtml = '<div class="popup-content">';
                    if (loc.photoUrl && loc.photoUrl.trim().length > 0) {
                        popupHtml += '<img src="' + loc.photoUrl + '" alt="' + (loc.title || '') + '" />';
                    }
                    popupHtml += '<div class="popup-title">' + (loc.title || 'Dream Destination') + '</div>';
                    popupHtml += '<span class="popup-status ' + statusClass + '">' + (loc.status || 'Dreaming') + '</span>';
                    if (loc.description && loc.description.trim().length > 0) {
                        popupHtml += '<div class="popup-desc">' + loc.description + '</div>';
                    }
                    popupHtml += '</div>';

                    marker.bindPopup(popupHtml);

                    marker.on('click', function() {
                        if (window.AndroidBridge && window.AndroidBridge.onMarkerClicked) {
                            window.AndroidBridge.onMarkerClicked(loc.id || loc._id || '');
                        }
                    });

                    markersLayer.addLayer(marker);

                    if (loc.status === 'Visited') {
                        visitedCoords.push([lat, lng]);
                    }
                });

                if (visitedCoords.length > 1) {
                    var polyline = L.polyline(visitedCoords, {
                        color: '#FF5E8E',
                        weight: 3,
                        dashArray: '6, 10',
                        opacity: 0.85
                    });
                    polylineLayer.addLayer(polyline);
                }

                if (bounds.length > 0) {
                    map.fitBounds(bounds, { padding: [50, 50], maxZoom: 8 });
                }
            } catch (e) {
                console.error('Error rendering locations:', e);
            }
        }

        function flyToLocation(lat, lng, zoom) {
            if (map) {
                map.flyTo([lat, lng], zoom || 8, { duration: 1.5 });
            }
        }

        function addDraftMarker(lat, lng) {
            if (draftMarker) {
                map.removeLayer(draftMarker);
            }
            var icon = L.divIcon({
                className: '',
                html: '<div class="custom-heart-pin pin-dreaming" style="border-style:dashed;"><span>📍</span></div>',
                iconSize: [44, 44],
                iconAnchor: [22, 22]
            });
            draftMarker = L.marker([lat, lng], { icon: icon }).addTo(map);
        }

        function removeDraftMarker() {
            if (draftMarker) {
                map.removeLayer(draftMarker);
                draftMarker = null;
            }
        }

        window.onload = initMap;
    </script>
</body>
</html>
