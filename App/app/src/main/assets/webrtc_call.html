<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>OurBloom Video Call</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #0d0f14;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #call-container {
      position: relative;
      width: 100%;
      height: 100%;
      background: #0d0f14;
    }
    /* Remote Video - Full Screen */
    #remoteVideo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      background-color: #0d0f14;
      display: block;
      transform: scaleX(1);
      image-rendering: -webkit-optimize-contrast;
    }
    /* Local Video - Floating Picture-in-Picture */
    #localVideoContainer {
      position: absolute;
      top: 64px;
      right: 16px;
      width: 105px;
      height: 150px;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      border: 2px solid rgba(255, 255, 255, 0.25);
      background-color: #1a1d24;
      z-index: 20;
      touch-action: none;
      transition: left 0.3s cubic-bezier(0.2, 0, 0.2, 1), top 0.3s cubic-bezier(0.2, 0, 0.2, 1);
    }
    #localVideo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1); /* mirror selfie cam */
      transition: opacity 0.2s ease;
    }
    #localVideo.rear-camera {
      transform: scaleX(1); /* don't mirror rear cam */
    }
    /* Hidden snapshot canvas */
    #snapshotCanvas {
      display: none;
    }
  </style>
</head>
<body>
  <div id="call-container">
    <video id="remoteVideo" autoplay playsinline></video>
    <div id="localVideoContainer">
      <video id="localVideo" autoplay playsinline muted></video>
      <div id="localCameraOffPlaceholder" style="display:none; position:absolute; inset:0; flex-direction:column; align-items:center; justify-content:center; background:#1a1d24; color:#FF8FA3; font-size:11px; text-align:center; pointer-events:none;">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#FF4D6D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="1" y1="1" x2="23" y2="23"></line>
          <path d="M21 21H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h3m3-3h6l2 3h4a2 2 0 0 1 2 2v9.34"></path>
          <circle cx="12" cy="13" r="4"></circle>
        </svg>
        <span style="margin-top:6px; font-weight:600;">Cam Off</span>
      </div>
    </div>
    <canvas id="snapshotCanvas"></canvas>
  </div>

  <script>
    let localStream = null;
    let remoteStream = null;
    let peerConnection = null;
    let currentFacingMode = 'user'; // 'user' or 'environment'
    let isMicMuted = false;
    let isCameraMuted = false;
    let queuedCandidates = [];

    const configuration = {
      iceServers: [
        {
          urls: [
            'stun:stun.l.google.com:19302',
            'stun:stun1.l.google.com:19302',
            'stun:stun2.l.google.com:19302',
            'stun:stun3.l.google.com:19302',
            'stun:stun4.l.google.com:19302',
            'stun:stun.relay.metered.ca:80'
          ]
        },
        {
          urls: [
            'turn:openrelay.metered.ca:80',
            'turn:openrelay.metered.ca:443',
            'turn:openrelay.metered.ca:443?transport=tcp'
          ],
          username: 'openrelayproject',
          credential: 'openrelayproject'
        },
        {
          urls: [
            'turns:openrelay.metered.ca:443?transport=tcp'
          ],
          username: 'openrelayproject',
          credential: 'openrelayproject'
        }
      ],
      iceCandidatePoolSize: 10,
      bundlePolicy: 'max-bundle',
      rtcpMuxPolicy: 'require'
    };

    const localVideo = document.getElementById('localVideo');
    const remoteVideo = document.getElementById('remoteVideo');
    const snapshotCanvas = document.getElementById('snapshotCanvas');

    // Notify Android bridge safely
    function bridgeCall(method, ...args) {
      if (window.AndroidCallBridge && typeof window.AndroidCallBridge[method] === 'function') {
        try {
          window.AndroidCallBridge[method](...args);
        } catch (e) {
          console.error("Bridge call error:", method, e);
        }
      }
    }

    let iceDisconnectTimer = null;

    // Camera stream acquisition with high-res ideal constraints and resilient fallback
    async function getCameraStream(facing, withAudio = true) {
      try {
        const constraints = {
          video: {
            facingMode: facing,
            width: { ideal: 1280 },
            height: { ideal: 720 },
            frameRate: { ideal: 30 }
          }
        };
        if (withAudio) {
          constraints.audio = {
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true
          };
        }
        return await navigator.mediaDevices.getUserMedia(constraints);
      } catch (err) {
        console.warn("High-res constraints failed, falling back to basic:", err);
        return await navigator.mediaDevices.getUserMedia({
          video: { facingMode: facing },
          audio: withAudio ? {
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true
          } : false
        });
      }
    }

    // Initialize media streams
    async function initMedia() {
      try {
        localStream = await getCameraStream(currentFacingMode, true);
        localVideo.srcObject = localStream;
        bridgeCall('onCameraReady');
        return true;
      } catch (err) {
        console.error("Error accessing camera/mic:", err);
        bridgeCall('onError', "Camera/Mic access failed: " + err.message);
        return false;
      }
    }

    function createPeerConnection() {
      if (peerConnection) {
        return;
      }

      peerConnection = new RTCPeerConnection(configuration);

      // Prioritize hardware accelerated codecs (H.264 / VP9)
      prioritizeHighQualityCodecs();

      // Add local tracks to peer connection
      if (localStream) {
        localStream.getTracks().forEach(track => {
          peerConnection.addTrack(track, localStream);
        });
      }

      // Handle ICE candidate generation
      peerConnection.onicecandidate = (event) => {
        if (event.candidate) {
          const candidateStr = JSON.stringify(event.candidate);
          bridgeCall('onIceCandidate', candidateStr);
        }
      };

      // Remote stream received
      peerConnection.ontrack = (event) => {
        console.log("Remote track received:", event.streams, event.track ? event.track.kind : '');
        if (event.streams && event.streams[0]) {
          const stream = event.streams[0];
          remoteStream = stream;
          // Guard against resetting srcObject if already assigned (prevents interrupting audio play)
          if (remoteVideo.srcObject !== stream) {
            remoteVideo.srcObject = stream;
            remoteVideo.play().catch(e => console.log("Remote play note:", e.message));
          }
          bridgeCall('onCallConnected');
        }
      };

      peerConnection.oniceconnectionstatechange = () => {
        if (!peerConnection) return;
        const state = peerConnection.iceConnectionState;
        console.log("ICE Connection State:", state);
        if (state === 'connected' || state === 'completed') {
          if (iceDisconnectTimer) {
            clearTimeout(iceDisconnectTimer);
            iceDisconnectTimer = null;
          }
          bridgeCall('onCallConnected');
        } else if (state === 'disconnected') {
          console.log("ICE disconnected, attempting recovery...");
          if (peerConnection && typeof peerConnection.restartIce === 'function') {
            try {
              peerConnection.restartIce();
            } catch (e) {
              console.warn("restartIce note:", e);
            }
          }
          // Debounce 12 seconds to allow ICE recovery / TURN failover on network handoff
          if (!iceDisconnectTimer) {
            iceDisconnectTimer = setTimeout(() => {
              if (peerConnection && (peerConnection.iceConnectionState === 'disconnected' || peerConnection.iceConnectionState === 'failed')) {
                bridgeCall('onCallDisconnected', 'ICE disconnected');
              }
            }, 12000);
          }
        } else if (state === 'failed') {
          console.log("ICE failed, attempting restartIce before disconnect...");
          if (peerConnection && typeof peerConnection.restartIce === 'function') {
            try {
              peerConnection.restartIce();
            } catch (e) {}
          }
          if (!iceDisconnectTimer) {
            iceDisconnectTimer = setTimeout(() => {
              if (peerConnection && peerConnection.iceConnectionState === 'failed') {
                bridgeCall('onCallDisconnected', 'ICE failed');
              }
            }, 8000);
          }
        }
      };

      peerConnection.onconnectionstatechange = () => {
        if (!peerConnection) return;
        const state = peerConnection.connectionState;
        console.log("Connection State:", state);
        if (state === 'connected') {
          if (iceDisconnectTimer) {
            clearTimeout(iceDisconnectTimer);
            iceDisconnectTimer = null;
          }
          bridgeCall('onCallConnected');
        } else if (state === 'failed' || state === 'closed') {
          if (iceDisconnectTimer) {
            clearTimeout(iceDisconnectTimer);
            iceDisconnectTimer = null;
          }
          bridgeCall('onCallDisconnected', state);
        }
      };
    }

    function safeParseJson(data) {
      if (!data) return null;
      if (typeof data !== 'string') return data;
      try {
        if (data.includes('%')) {
          data = decodeURIComponent(data);
        }
        return JSON.parse(data);
      } catch (e) {
        try {
          return JSON.parse(data);
        } catch (err) {
          console.error("JSON parse error:", err, data);
          return null;
        }
      }
    }

    // Optimize Opus SDP parameters for studio-grade, crackle-free audio
    function enhanceOpusSdp(sdp) {
      if (!sdp || typeof sdp !== 'string') return sdp;
      try {
        const opusMatch = sdp.match(/a=rtpmap:(\d+)\s+opus\/48000\/2/i);
        if (!opusMatch) return sdp;
        const pt = opusMatch[1];

        // Optimal parameters for natural, crackle-free WebRTC voice communication:
        // - useinbandfec=1: in-band Forward Error Correction to recover lost packets seamlessly
        // - usedtx=0: disables discontinuous transmission to eliminate voice clipping/gating
        // - maxaveragebitrate=64000: 64 kbps wideband voice (studio clarity)
        const opusParams = [
          'useinbandfec=1',
          'usedtx=0',
          'maxaveragebitrate=64000'
        ];

        const fmtpRegex = new RegExp(`a=fmtp:${pt}\\s+(.+)`, 'i');
        const fmtpMatch = sdp.match(fmtpRegex);

        if (fmtpMatch) {
          const existing = fmtpMatch[1].split(';').map(p => p.trim());
          const merged = [...existing];
          opusParams.forEach(p => {
            const key = p.split('=')[0];
            const idx = merged.findIndex(ep => ep.startsWith(key + '='));
            if (idx >= 0) {
              merged[idx] = p;
            } else {
              merged.push(p);
            }
          });
          return sdp.replace(fmtpRegex, `a=fmtp:${pt} ${merged.join(';')}`);
        } else {
          return sdp.replace(
            new RegExp(`(a=rtpmap:${pt}\\s+opus\\/48000\\/2\\r?\\n)`, 'i'),
            `$1a=fmtp:${pt} ${opusParams.join(';')}\r\n`
          );
        }
      } catch (e) {
        console.warn("Opus SDP enhancement warning:", e);
        return sdp;
      }
    }

    // Optimize media senders: give audio highest network priority & tune video bandwidth
    async function optimizeMediaSenders() {
      if (!peerConnection) return;
      try {
        const senders = peerConnection.getSenders();

        // 1. Audio Sender: Ensure high network priority and dedicated 64kbps allocation
        const audioSender = senders.find(s => s.track && s.track.kind === 'audio');
        if (audioSender && typeof audioSender.getParameters === 'function') {
          try {
            const audioParams = audioSender.getParameters();
            if (!audioParams.encodings || audioParams.encodings.length === 0) {
              audioParams.encodings = [{}];
            }
            audioParams.encodings[0].maxBitrate = 64000;
            audioParams.encodings[0].priority = 'high';
            audioParams.encodings[0].networkPriority = 'high';
            await audioSender.setParameters(audioParams);
            console.log("✿ Audio sender prioritized at 64kbps");
          } catch (e) {
            console.warn("Audio param note:", e.message);
          }
        }

        // 2. Video Sender: Balanced 1.8 Mbps (crisp 720p 30fps without starving audio)
        const videoSender = senders.find(s => s.track && s.track.kind === 'video');
        if (videoSender && typeof videoSender.getParameters === 'function') {
          try {
            const parameters = videoSender.getParameters();
            if (!parameters.encodings || parameters.encodings.length === 0) {
              parameters.encodings = [{}];
            }
            parameters.encodings[0].maxBitrate = 1800000; // 1.8 Mbps
            parameters.encodings[0].scaleResolutionDownBy = 1.0;
            parameters.encodings[0].maxFramerate = 30;
            parameters.degradationPreference = 'maintain-framerate';
            await videoSender.setParameters(parameters);
            console.log("✿ Video encoder configured: 1.8 Mbps 720p 30fps");
          } catch (e) {
            console.warn("Video param note:", e.message);
          }
        }
      } catch (e) {
        console.warn("Media sender optimization error:", e);
      }
    }

    function prioritizeHighQualityCodecs() {
      if (!peerConnection || typeof RTCRtpSender.getCapabilities !== 'function') return;
      try {
        const transceivers = peerConnection.getTransceivers();
        const videoTransceiver = transceivers.find(t => t.sender && t.sender.track && t.sender.track.kind === 'video');
        if (videoTransceiver && typeof videoTransceiver.setCodecPreferences === 'function') {
          const capabilities = RTCRtpSender.getCapabilities('video');
          if (capabilities && capabilities.codecs) {
            const sortedCodecs = [...capabilities.codecs].sort((a, b) => {
              const aScore = a.mimeType.includes('H264') ? 2 : (a.mimeType.includes('VP9') ? 1 : 0);
              const bScore = b.mimeType.includes('H264') ? 2 : (b.mimeType.includes('VP9') ? 1 : 0);
              return bScore - aScore;
            });
            videoTransceiver.setCodecPreferences(sortedCodecs);
            console.log("✿ Prioritized high-fidelity video codecs (H.264/VP9)");
          }
        }
      } catch (e) {
        console.warn("Could not set codec preferences:", e);
      }
    }

    // Called by Android when initiating a call
    async function startCall() {
      try {
        if (!localStream) {
          const ready = await initMedia();
          if (!ready) return;
        }
        createPeerConnection();

        let offer = await peerConnection.createOffer({
          offerToReceiveAudio: true,
          offerToReceiveVideo: true
        });
        offer.sdp = enhanceOpusSdp(offer.sdp);
        await peerConnection.setLocalDescription(offer);
        await optimizeMediaSenders();

        bridgeCall('onLocalDescription', 'offer', JSON.stringify(offer));
      } catch (err) {
        console.error("Failed to start call:", err);
        bridgeCall('onError', "Offer creation error: " + err.message);
      }
    }

    // Called by Android when receiving an offer
    async function handleOffer(offerJson) {
      try {
        if (!localStream) {
          const ready = await initMedia();
          if (!ready) return;
        }
        createPeerConnection();

        const offer = safeParseJson(offerJson);
        if (!offer) return;
        await peerConnection.setRemoteDescription(new RTCSessionDescription(offer));

        // Process queued ICE candidates
        while (queuedCandidates.length > 0) {
          const cand = queuedCandidates.shift();
          try {
            await peerConnection.addIceCandidate(new RTCIceCandidate(cand));
          } catch (e) {
            console.warn("Failed to add queued candidate:", e);
          }
        }

        let answer = await peerConnection.createAnswer();
        answer.sdp = enhanceOpusSdp(answer.sdp);
        await peerConnection.setLocalDescription(answer);
        await optimizeMediaSenders();

        bridgeCall('onLocalDescription', 'answer', JSON.stringify(answer));
      } catch (err) {
        console.error("Failed to handle offer:", err);
        bridgeCall('onError', "Answer creation error: " + err.message);
      }
    }

    // Called by Android when caller receives answer
    async function handleAnswer(answerJson) {
      try {
        if (!peerConnection) return;
        if (peerConnection.signalingState !== 'have-local-offer') {
          console.log("Ignoring answer: signalingState is " + peerConnection.signalingState);
          return;
        }
        let answer = safeParseJson(answerJson);
        if (!answer) return;
        await peerConnection.setRemoteDescription(new RTCSessionDescription(answer));
        await optimizeMediaSenders();

        // Process queued ICE candidates
        while (queuedCandidates.length > 0) {
          const cand = queuedCandidates.shift();
          try {
            await peerConnection.addIceCandidate(new RTCIceCandidate(cand));
          } catch (e) {
            console.warn("Failed to add queued candidate:", e);
          }
        }
      } catch (err) {
        console.error("Failed to handle answer:", err);
      }
    }

    // Called by Android when an ICE candidate is received from Firestore
    async function handleCandidate(candidateJson) {
      try {
        const candidate = safeParseJson(candidateJson);
        if (!candidate) return;
        if (peerConnection && peerConnection.remoteDescription && peerConnection.remoteDescription.type) {
          await peerConnection.addIceCandidate(new RTCIceCandidate(candidate));
        } else {
          queuedCandidates.push(candidate);
        }
      } catch (err) {
        console.warn("Error adding candidate:", err);
      }
    }

    // Toggle Microphone
    function setMicMuted(muted) {
      isMicMuted = muted;
      if (localStream) {
        localStream.getAudioTracks().forEach(track => {
          track.enabled = !muted;
        });
      }
    }

    // Toggle Camera On/Off
    function setCameraMuted(muted) {
      isCameraMuted = muted;
      if (localStream) {
        localStream.getVideoTracks().forEach(track => {
          track.enabled = !muted;
        });
      }
      const placeholder = document.getElementById('localCameraOffPlaceholder');
      if (placeholder) {
        placeholder.style.display = muted ? 'flex' : 'none';
      }
      if (localVideo) {
        localVideo.style.opacity = muted ? '0' : '1';
      }
    }

    let currentDeviceId = null;

    // Flip Camera between front & rear
    async function switchCamera() {
      try {
        const nextFacing = (currentFacingMode === 'user') ? 'environment' : 'user';
        console.log("Switching camera from", currentFacingMode, "to:", nextFacing);

        // 1. MUST stop existing video track FIRST before requesting a new camera,
        // otherwise Android Camera HAL throws "Could not start video source / camera busy"
        let oldVideoTrack = null;
        if (localStream) {
          const videoTracks = localStream.getVideoTracks();
          if (videoTracks.length > 0) {
            oldVideoTrack = videoTracks[0];
            try {
              if (oldVideoTrack.getSettings && oldVideoTrack.getSettings().deviceId) {
                currentDeviceId = oldVideoTrack.getSettings().deviceId;
              }
            } catch (_) {}
            oldVideoTrack.stop();
            localStream.removeTrack(oldVideoTrack);
          }
        }

        // Wait 120ms for Android Camera HAL to safely close previous camera device
        await new Promise(r => setTimeout(r, 120));

        // 2. Request stream with new camera
        let newStream = null;

        // A. Try device enumeration first (most reliable on Android WebView to alternate sensors)
        try {
          const devices = await navigator.mediaDevices.enumerateDevices();
          const videoDevices = devices.filter(d => d.kind === 'videoinput');
          console.log("Enumerated video devices count:", videoDevices.length);

          if (videoDevices.length > 1) {
            let targetDevice = null;
            if (currentDeviceId) {
              targetDevice = videoDevices.find(d => d.deviceId && d.deviceId !== currentDeviceId);
            }
            if (!targetDevice) {
              targetDevice = (nextFacing === 'environment') ? videoDevices[videoDevices.length - 1] : videoDevices[0];
            }

            if (targetDevice && targetDevice.deviceId) {
              console.log("Switching using deviceId:", targetDevice.deviceId);
              newStream = await navigator.mediaDevices.getUserMedia({
                video: {
                  deviceId: { exact: targetDevice.deviceId },
                  width: { ideal: 1280 },
                  height: { ideal: 720 },
                  frameRate: { ideal: 30 }
                },
                audio: false
              });
            }
          }
        } catch (eDev) {
          console.warn("Device enumeration switch failed:", eDev);
        }

        // B. Fallback to facingMode constraint if device enumeration didn't produce stream
        if (!newStream) {
          try {
            console.log("Switching using facingMode exact:", nextFacing);
            newStream = await navigator.mediaDevices.getUserMedia({
              video: {
                facingMode: { exact: nextFacing },
                width: { ideal: 1280 },
                height: { ideal: 720 },
                frameRate: { ideal: 30 }
              },
              audio: false
            });
          } catch (eExact) {
            console.warn("Exact facingMode failed, trying soft facingMode:", eExact);
            try {
              newStream = await navigator.mediaDevices.getUserMedia({
                video: {
                  facingMode: nextFacing,
                  width: { ideal: 1280 },
                  height: { ideal: 720 }
                },
                audio: false
              });
            } catch (eSoft) {
              console.warn("Soft facingMode failed:", eSoft);
            }
          }
        }

        // C. Fallback: Restore previous camera if switch failed completely
        if (!newStream) {
          console.warn("Switch completely failed; restoring previous camera");
          try {
            newStream = await navigator.mediaDevices.getUserMedia({
              video: { facingMode: currentFacingMode },
              audio: false
            });
          } catch (eRestore) {
            console.error("Camera restoration failed:", eRestore);
          }
        }

        if (newStream) {
          currentFacingMode = nextFacing;
          const newVideoTrack = newStream.getVideoTracks()[0];
          try {
            if (newVideoTrack.getSettings && newVideoTrack.getSettings().deviceId) {
              currentDeviceId = newVideoTrack.getSettings().deviceId;
            }
          } catch (_) {}

          if (currentFacingMode === 'user') {
            localVideo.classList.remove('rear-camera');
          } else {
            localVideo.classList.add('rear-camera');
          }

          if (localStream) {
            localStream.addTrack(newVideoTrack);
            localVideo.srcObject = localStream;
          } else {
            localStream = newStream;
            localVideo.srcObject = localStream;
          }

          if (isCameraMuted) {
            newVideoTrack.enabled = false;
          }

          if (peerConnection) {
            const senders = peerConnection.getSenders();
            let videoSender = senders.find(s => s.track && s.track.kind === 'video');
            if (!videoSender && peerConnection.getTransceivers) {
              const transceivers = peerConnection.getTransceivers();
              const videoTransceiver = transceivers.find(t => (t.receiver && t.receiver.track && t.receiver.track.kind === 'video') || (t.sender && t.sender.track && t.sender.track.kind === 'video'));
              if (videoTransceiver) {
                videoSender = videoTransceiver.sender;
              }
            }
            if (videoSender) {
              await videoSender.replaceTrack(newVideoTrack);
              console.log("Replaced video track on WebRTC peer connection successfully");
            }
          }

          bridgeCall('onCameraSwitched', currentFacingMode);
        }
      } catch (err) {
        console.error("Camera switch error:", err);
        bridgeCall('onError', "Camera switch error: " + err.message);
      }
    }

    // ==========================================
    // CAPTURE MOMENT 📸 (High-Res Snapshot)
    // ==========================================
    function captureMoment() {
      try {
        // Choose source: Prefer remote video if streaming, fallback to local video
        let targetVideo = null;
        if (remoteVideo && remoteVideo.readyState >= 2 && remoteVideo.videoWidth > 0) {
          targetVideo = remoteVideo;
        } else if (localVideo && localVideo.readyState >= 2 && localVideo.videoWidth > 0) {
          targetVideo = localVideo;
        }

        if (!targetVideo) {
          return;
        }

        const width = targetVideo.videoWidth || 1280;
        const height = targetVideo.videoHeight || 720;

        snapshotCanvas.width = width;
        snapshotCanvas.height = height;

        const ctx = snapshotCanvas.getContext('2d', { alpha: false, desynchronized: true });
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';
        ctx.clearRect(0, 0, width, height);

        // Draw the video frame at full pixel resolution
        ctx.drawImage(targetVideo, 0, 0, width, height);

        // Export maximum-quality JPEG base64 data (0.98 for near-lossless clarity)
        const dataUrl = snapshotCanvas.toDataURL('image/jpeg', 0.98);
        // Strip data:image/jpeg;base64, prefix for efficient Kotlin Base64 decode
        const base64Data = dataUrl.split(',')[1];

        bridgeCall('onMomentCaptured', base64Data);
      } catch (err) {
        console.error("Moment capture failed:", err);
      }
    }

    // Clean up call
    function endCall() {
      if (iceDisconnectTimer) {
        clearTimeout(iceDisconnectTimer);
        iceDisconnectTimer = null;
      }
      if (localStream) {
        localStream.getTracks().forEach(t => t.stop());
        localStream = null;
      }
      if (peerConnection) {
        peerConnection.close();
        peerConnection = null;
      }
      localVideo.srcObject = null;
      remoteVideo.srcObject = null;
      queuedCandidates = [];
    }

    // Draggable PiP with smooth corner snapping
    function setupPipDrag() {
      const pip = document.getElementById('localVideoContainer');
      if (!pip) return;

      let isDragging = false;
      let startX = 0, startY = 0;
      let initialLeft = 0, initialTop = 0;
      const margin = 16;
      const topSafe = 72;
      const bottomSafe = 130;

      pip.addEventListener('touchstart', (e) => {
        if (e.touches.length !== 1) return;
        isDragging = true;
        const touch = e.touches[0];
        const rect = pip.getBoundingClientRect();
        initialLeft = rect.left;
        initialTop = rect.top;
        startX = touch.clientX;
        startY = touch.clientY;
        pip.style.transition = 'none';
      }, { passive: true });

      window.addEventListener('touchmove', (e) => {
        if (!isDragging || e.touches.length !== 1) return;
        const touch = e.touches[0];
        const dx = touch.clientX - startX;
        const dy = touch.clientY - startY;

        let newLeft = initialLeft + dx;
        let newTop = initialTop + dy;

        const maxLeft = window.innerWidth - pip.offsetWidth - margin;
        const maxTop = window.innerHeight - pip.offsetHeight - bottomSafe;

        newLeft = Math.max(margin, Math.min(newLeft, maxLeft));
        newTop = Math.max(topSafe, Math.min(newTop, maxTop));

        pip.style.left = newLeft + 'px';
        pip.style.top = newTop + 'px';
        pip.style.right = 'auto';
        pip.style.bottom = 'auto';
      }, { passive: true });

      window.addEventListener('touchend', () => {
        if (!isDragging) return;
        isDragging = false;

        pip.style.transition = 'left 0.3s cubic-bezier(0.2, 0, 0.2, 1), top 0.3s cubic-bezier(0.2, 0, 0.2, 1)';

        const rect = pip.getBoundingClientRect();
        const midX = window.innerWidth / 2;
        const midY = window.innerHeight / 2;

        const snapLeft = (rect.left + rect.width / 2 < midX) ? margin : (window.innerWidth - pip.offsetWidth - margin);
        const snapTop = (rect.top + rect.height / 2 < midY) ? topSafe : (window.innerHeight - pip.offsetHeight - bottomSafe);

        pip.style.left = snapLeft + 'px';
        pip.style.top = snapTop + 'px';
      }, { passive: true });
    }

    // Auto initialize camera preview on load
    window.addEventListener('DOMContentLoaded', () => {
      initMedia();
      setupPipDrag();
    });
  </script>
</body>
