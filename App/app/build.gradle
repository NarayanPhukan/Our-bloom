plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.gms.google-services'
}

Properties localProperties = new Properties()
File localPropertiesFile = project.rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localProperties.load(new FileInputStream(localPropertiesFile))
}

String vaultAccount = localProperties.getProperty("VAULT_ACCOUNT_NUMBER", "")
String vaultIfsc = localProperties.getProperty("VAULT_IFSC_CODE", "")
String vaultBank = localProperties.getProperty("VAULT_BANK_NAME", "")
String vaultVpa = localProperties.getProperty("VAULT_UPI_VPA", "")
String payuKey = localProperties.getProperty("PAYU_KEY", "qSYSCh")
String payuSalt = localProperties.getProperty("PAYU_SALT", "ILJi7wHiIDwmOFT1VAWBh6hCfSpkVYfA")
String payuMode = localProperties.getProperty("PAYU_MODE", "live")

android {
    namespace 'com.ourbloom.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.ourbloom.app"
        minSdk 21
        targetSdk 34
        versionCode 55
        versionName "1.54"
        
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
        }

        buildConfigField "String", "VAULT_ACCOUNT_NUMBER", "\"${vaultAccount}\""
        buildConfigField "String", "VAULT_IFSC_CODE", "\"${vaultIfsc}\""
        buildConfigField "String", "VAULT_BANK_NAME", "\"${vaultBank}\""
        buildConfigField "String", "VAULT_UPI_VPA", "\"${vaultVpa}\""
        buildConfigField "String", "PAYU_KEY", "\"${payuKey}\""
        buildConfigField "String", "PAYU_SALT", "\"${payuSalt}\""
        buildConfigField "String", "PAYU_MODE", "\"${payuMode}\""

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    packagingOptions {
        resources {
            excludes += ['**/firebase-service-account.json', '**/*service-account*.json']
        }
    }

    buildFeatures {
        buildConfig = true
    }

    signingConfigs {
        release {
            storeFile file('../ourbloom-release.jks')
            storePassword 'ourbloom2026'
            keyAlias 'ourbloom'
            keyPassword 'ourbloom2026'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.release
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
    implementation 'androidx.browser:browser:1.8.0'
    
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    // Firebase
    implementation platform('com.google.firebase:firebase-bom:32.7.2')
    implementation("com.google.firebase:firebase-auth")
    implementation("com.google.android.gms:play-services-auth:21.2.0")
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.7.3'
    
    // OkHttp for file uploads
    implementation("com.squareup.okhttp3:okhttp:4.12.0")
    
    // Navigation
    implementation 'androidx.navigation:navigation-fragment-ktx:2.7.7'
    implementation 'androidx.navigation:navigation-ui-ktx:2.7.7'

    // CameraX
    def camerax_version = "1.4.0"
    implementation "androidx.camera:camera-core:${camerax_version}"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-view:${camerax_version}"

    // Firebase Cloud Messaging (FCM)
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'androidx.work:work-runtime-ktx:2.9.0'

    // Google Maps
    implementation 'com.google.android.gms:play-services-maps:18.2.0'
    
    // Glide
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation 'com.github.bumptech.glide:okhttp3-integration:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'
}
