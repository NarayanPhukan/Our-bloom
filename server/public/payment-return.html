<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Payment Successful • OurBloom</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    :root {
      --primary: #E85D75;
      --primary-dark: #D4435C;
      --success: #2E7D32;
      --success-bg: #E8F5E9;
      --bg: #FFF8F9;
      --text-main: #2D2D2D;
      --text-muted: #666666;
      --card-bg: #FFFFFF;
      --card-border: #F3D9E0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px 16px;
      -webkit-font-smoothing: antialiased;
    }

    .card {
      background: var(--card-bg);
      border-radius: 28px;
      padding: 40px 28px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 12px 48px rgba(232, 93, 117, 0.14);
      border: 1px solid var(--card-border);
      animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .icon-container {
      width: 80px;
      height: 80px;
      background: var(--success-bg);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px auto;
      font-size: 38px;
      animation: pop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes pop {
      0% { transform: scale(0.4); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 8px;
      letter-spacing: -0.3px;
    }

    .subtitle {
      font-size: 15px;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 28px;
    }

    .badge-paid {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--success-bg);
      color: var(--success);
      font-weight: 600;
      font-size: 13px;
      padding: 6px 14px;
      border-radius: 20px;
      margin-bottom: 24px;
    }

    .btn-return {
      display: block;
      width: 100%;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: #FFFFFF;
      text-decoration: none;
      font-size: 16px;
      font-weight: 600;
      padding: 16px 24px;
      border-radius: 28px;
      box-shadow: 0 6px 20px rgba(232, 93, 117, 0.35);
      border: none;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .btn-return:active {
      transform: scale(0.98);
      box-shadow: 0 2px 10px rgba(232, 93, 117, 0.25);
    }

    .hint {
      margin-top: 18px;
      font-size: 13px;
      color: #888888;
    }

    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(232, 93, 117, 0.3);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-container">
      🌸
    </div>

    <h1>Payment Completed!</h1>
    <div class="badge-paid">
      ✓ Verified & Approved
    </div>

    <p class="subtitle">
      Your contribution has been received. Redirecting back to your Couple's Vault...
    </p>

    <a id="btnReturn" class="btn-return" href="ourbloom://razorpay-return">
      Return to OurBloom
    </a>

    <p class="hint">
      <span class="spinner"></span> Tap the button above if OurBloom does not reopen automatically.
    </p>
  </div>

  <script>
    (function() {
      var params = new URLSearchParams(window.location.search);
      var txnid = params.get('txnid') || '';
      var paymentId = params.get('razorpay_payment_id') || '';
      var linkId = params.get('razorpay_payment_link_id') || '';
      var status = params.get('razorpay_payment_link_status') || 'success';

      var deepLink = 'ourbloom://razorpay-return?txnid=' + encodeURIComponent(txnid) +
        '&payment_id=' + encodeURIComponent(paymentId) +
        '&link_id=' + encodeURIComponent(linkId) +
        '&status=' + encodeURIComponent(status);

      var btn = document.getElementById('btnReturn');
      if (btn) {
        btn.href = deepLink;
      }

      // Auto-launch deep link back to Android app
      setTimeout(function() {
        window.location.href = deepLink;
      }, 350);
    })();
  </script>
</body>
</html>
